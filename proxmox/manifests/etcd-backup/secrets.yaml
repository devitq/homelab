apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-backup-secrets
  namespace: backup-system
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore

  target:
    name: etcd-backup-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .awsAccessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .awsSecretAccessKey }}"
        AWS_REGION: "{{ .awsRegion }}"
        CUSTOM_S3_ENDPOINT: "{{ .customS3Endpoint }}"
        BUCKET: "{{ .bucket }}"
        AGE_RECIPIENT_PUBLIC_KEY: "{{ .ageRecipientPublicKey }}"

  data:
    - secretKey: awsAccessKeyId
      remoteRef:
        key: /etcd-backup/AWS_ACCESS_KEY_ID

    - secretKey: awsSecretAccessKey
      remoteRef:
        key: /etcd-backup/AWS_SECRET_ACCESS_KEY

    - secretKey: awsRegion
      remoteRef:
        key: /etcd-backup/AWS_REGION

    - secretKey: customS3Endpoint
      remoteRef:
        key: /etcd-backup/CUSTOM_S3_ENDPOINT

    - secretKey: bucket
      remoteRef:
        key: /etcd-backup/BUCKET

    - secretKey: ageRecipientPublicKey
      remoteRef:
        key: /etcd-backup/AGE_RECIPIENT_PUBLIC_KEY

  refreshInterval: 1h
