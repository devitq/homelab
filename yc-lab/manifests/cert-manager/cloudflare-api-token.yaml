apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Orphan
    template:
      type: Opaque
  data:
    - secretKey: api-token
      remoteRef:
        key: /cert-manager/CLOUDFLARE_API_TOKEN
