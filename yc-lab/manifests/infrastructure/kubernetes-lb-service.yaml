apiVersion: v1
kind: Service
metadata:
  name: kubernetes-lb
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - name: https
      port: 8443
      targetPort: 6443
      protocol: TCP
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kubernetes-lb
  namespace: default
subsets:
  - addresses:
      - ip: 10.4.0.10
      - ip: 10.5.0.24
    ports:
      - name: https
        port: 6443
        protocol: TCP
