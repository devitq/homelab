apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://itzg.github.io/minecraft-server-charts/
    targetRevision: 5.2.0
    chart: minecraft
    helm:
      valuesObject:
        image:
          repository: ghcr.io/itzg/minecraft-server
        serviceAnnotations:
          lbipam.cilium.io/ips: 10.13.46.11
        replicaCount: 1
        minecraftServer:
          eula: "TRUE"
          difficulty: hard
          type: PAPER
          motd: '§l   §r      §c§l|\/|1|\|3(r4f7 1|\| |<u83r|\|373z'
          rcon:
            enabled: true
          serviceType: LoadBalancer
          onlineMode: false
          pluginUrls:
            - https://cdn.modrinth.com/data/TsLS8Py5/versions/uhXJCOpc/SkinsRestorer.jar
        persistence:
          dataDir:
            enabled: true
            Size: 2Gi
        resources:
          requests:
            cpu: 2000m
            memory: 2Gi
          limits:
            cpu: 8000m
            memory: 6Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
