apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-repo-password
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: homelab-repo
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: /argocd/ARGOCD_REPO_PASSWORD
