apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: grafana
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore

  target:
    name: grafana-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque

  data:
    - secretKey: client-secret
      remoteRef:
        key: /grafana/GRAFANA_OAUTH_CLIENT_SECRET

  refreshInterval: 1h
