    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "cilium-envoy-upstream",
        "namespace": "default",
        "uid": "8ff01bf5-fa52-4e7a-bd73-6e177d44a369",
        "resourceVersion": "1788358446375990",
        "generation": 1,
        "creationTimestamp": "2026-09-02T14:14:06Z",
        "labels": {
          "grafana.app/deprecatedInternalID": "979467957358592"
        },
        "annotations": {
          "grafana.app/createdBy": "user:cfx1picle4dmod",
          "grafana.app/saved-from-ui": "Grafana v13.2.0 (f681b1359f)"
        }
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "description": "Detailed upstream cluster monitoring for Envoy proxy. Tracks request rates, latency distributions (P50/P95/P99), success rates, connection health, circuit breaker status, retry behavior, and timeout patterns for each upstream cluster. Use this dashboard to troubleshoot backend service issues, identify performance bottlenecks, and monitor cluster health across all Envoy pods. Supports multi-cluster selection for comparative analysis. The dashboards were generated using [envoy-mixin](https://github.com/adinhodovic/envoy-mixin). Open issues and create feature requests in the repository.",
        "editable": false,
        "elements": {
          "panel-10": {
            "kind": "Panel",
            "spec": {
              "id": 10,
              "title": "Upstream Success Rate (Including 4xx errors)",
              "description": "Overall success rate counting both 4xx and 5xx as failures. Reflects end-user experience including authentication, authorization, and validation errors. Lower rates may indicate API contract mismatches, breaking changes, or integration issues between services.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  rate(\n    envoy_cluster_upstream_rq_xx{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n,\n      envoy_response_code_class!~\"4|5\"\n    }[$__rate_interval]\n  )\n)\n/\nsum(\n  rate(\n    envoy_cluster_upstream_rq_xx{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n    }[$__rate_interval]\n  )\n)\n* 100\n",
                            "legendFormat": "Success Rate"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v11.4.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "mean",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percent",
                      "custom": {
                        "axisSoftMax": 100,
                        "axisSoftMin": 0,
                        "fillOpacity": 100,
                        "lineWidth": 1,
                        "stacking": {
                          "mode": "normal"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-11": {
            "kind": "Panel",
            "spec": {
              "id": 11,
              "title": "Upstream Rate by Code Class",
              "description": "Request rate breakdown by HTTP status code class (2xx/3xx/4xx/5xx). Normal traffic shows dominant 2xx responses. Sudden 4xx spikes suggest client-side issues or API changes. Any 5xx indicates backend failures. Monitor 5xx rate to detect cascading failures early.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  rate(\n    envoy_cluster_upstream_rq_xx{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n    }[$__rate_interval]\n  )\n) by (envoy_response_code_class)\n",
                            "legendFormat": "{{ envoy_response_code_class }}xx"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v11.4.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "mean",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "reqps",
                      "custom": {
                        "axisSoftMin": 0,
                        "fillOpacity": 100,
                        "lineWidth": 1,
                        "stacking": {
                          "mode": "normal"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-12": {
            "kind": "Panel",
            "spec": {
              "id": 12,
              "title": "Upstream Rate by Code",
              "description": "Detailed request rate by specific HTTP status code (200, 404, 500, etc.). Use this to identify specific error patterns. For example, 503 may indicate overload, 502 suggests gateway issues, and 429 shows rate limiting activation. Helps pinpoint exact failure modes.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  rate(\n    envoy_cluster_upstream_rq{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n    }[$__rate_interval]\n  )\n) by (envoy_response_code)\n",
                            "legendFormat": "{{ envoy_response_code }}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v11.4.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "mean",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "reqps",
                      "custom": {
                        "axisSoftMin": 0,
                        "fillOpacity": 100,
                        "lineWidth": 1,
                        "stacking": {
                          "mode": "normal"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-13": {
            "kind": "Panel",
            "spec": {
              "id": 13,
              "title": "Upstream Healthy Percent",
              "description": "Percentage of healthy endpoints per cluster based on active health checks. 100% indicates all endpoints passing health checks. Drops suggest failing instances - check pod logs, resource usage, and health check configurations. Envoy removes unhealthy endpoints from load balancing rotation.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  envoy_cluster_membership_healthy{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n  }\n) by (envoy_cluster_name)\n/\nsum(\n  envoy_cluster_membership_total{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n  }\n) by (envoy_cluster_name)\n* 100\n",
                            "legendFormat": "{{ envoy_cluster_name }}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v11.4.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "mean",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percent",
                      "custom": {
                        "axisSoftMax": 100,
                        "axisSoftMin": 0,
                        "fillOpacity": 100,
                        "lineWidth": 1,
                        "stacking": {
                          "mode": "normal"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-14": {
            "kind": "Panel",
            "spec": {
              "id": 14,
              "title": "Upstream Concurrency",
              "description": "Current request and connection concurrency for the selected upstream cluster. Rising active requests with relatively flat connections points to request-level pressure. Rising connections and connection overflow points to connection-level pressure.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  envoy_cluster_upstream_rq_active{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n  }\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Active Requests"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  envoy_cluster_upstream_cx_active{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n  }\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Active Connections"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v11.4.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "mean",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "custom": {
                        "fillOpacity": 10
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-15": {
            "kind": "Panel",
            "spec": {
              "id": 15,
              "title": "Upstream Pending and Overflow",
              "description": "Pending queue activity and overflow signals for the selected upstream cluster. Pending overflow can indicate connection-pool overflow or request-breaker overflow, so a high overflow rate with low pending-active can still mean request concurrency pressure rather than a full queue.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  envoy_cluster_upstream_rq_pending_active{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n  }\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Pending Requests Active"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  rate(\n    envoy_cluster_upstream_rq_pending_total{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n    }[$__rate_interval]\n  )\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Pending Requests Rate"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  rate(\n    envoy_cluster_upstream_rq_pending_overflow{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n    }[$__rate_interval]\n  )\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Pending Overflow Rate"
                          }
                        },
                        "refId": "C",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  increase(\n    envoy_cluster_upstream_cx_overflow{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n    }[$__rate_interval]\n  )\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Connection Overflow Rate"
                          }
                        },
                        "refId": "D",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v11.4.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "mean",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "custom": {
                        "fillOpacity": 10
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-16": {
            "kind": "Panel",
            "spec": {
              "id": 16,
              "title": "Upstream Connections",
              "description": "Connection lifecycle metrics for the selected upstream cluster. Overflow indicates connection-related breaker pressure. Destroyed tracks normal or failed connection teardown. Connect failures suggest network issues, DNS problems, TLS issues, or unreachable backends.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  increase(\n    envoy_cluster_upstream_cx_overflow{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n    }[$__rate_interval]\n  )\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Overflow Connections"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  increase(\n    envoy_cluster_upstream_cx_destroy{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n    }[$__rate_interval]\n  )\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Destroyed Connections"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  increase(\n    envoy_cluster_upstream_cx_connect_fail{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n    }[$__rate_interval]\n  )\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Connect Failures"
                          }
                        },
                        "refId": "C",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v11.4.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "mean",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "custom": {
                        "fillOpacity": 10
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-17": {
            "kind": "Panel",
            "spec": {
              "id": 17,
              "title": "Upstream Circuit Breakers",
              "description": "Circuit breaker state for the selected upstream cluster. Non-zero values indicate protection mechanisms are currently open. Open Connections tracks the connection breaker, Open Pool Connections tracks connection-pool breaker pressure, and Open Requests tracks request breaker pressure rather than only a full pending queue.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  envoy_cluster_circuit_breakers_default_cx_open{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n  }\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Open Connections"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  envoy_cluster_circuit_breakers_default_cx_pool_open{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n,\nenvoy_cluster_name=\"$envoy_cluster_name\"\n\n  }\n) by (envoy_cluster_name)\n",
                            "legendFormat": "Open Pool Connections"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "exemplar": false,
