apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: movienight-cert
  namespace: movienight
spec:
  secretName: movienight-tls
  issuerRef:
    name: infisical
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
  duration: 720h
  renewBefore: 240h
  dnsNames:
    - movienight.itqdev.xyz
