apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vdeniske-backend-secrets
  namespace: vdeniske
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore

  target:
    name: vdeniske-backend-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        TURNSTILE_SECRET_KEY: "{{ .turnstileSecretKey }}"
        JWT_SECRET: "{{ .jwtSecret }}"
        POSTGRES_URL: "{{ .postgresUri }}"

  data:
    - secretKey: turnstileSecretKey
      remoteRef:
        key: /vdeniske/VDENISKE_TURNSTILE_SECRET_KEY
    - secretKey: jwtSecret
      remoteRef:
        key: /vdeniske/VDENISKE_JWT_SECRET
    - secretKey: postgresUri
      remoteRef:
        key: /vdeniske/VDENISKE_POSTGRES_URI

  refreshInterval: 1h
