apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    targetRevision: 9.2.1
    chart: falco
    helm:
      valuesObject:
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 200m
            memory: 512Mi

        tty: true

        services:
          - name: k8saudit-webhook
            type: ClusterIP
            ports:
              - port: 9765
                targetPort: 9765
                protocol: TCP
                name: http

        driver:
          enabled: true
          kind: modern_ebpf

        mounts:
          volumes:
            - name: falco-events
              hostPath:
                path: /var/log/falco
                type: DirectoryOrCreate
          volumeMounts:
            - name: falco-events
              mountPath: /var/log/falco

        falcosidekick:
          enabled: false

        falcoctl:
          artifact:
            install:
              enabled: true
            follow:
              enabled: true
          config:
            artifact:
              install:
                refs: ["falco-rules:latest", "falco-incubating-rules:latest", "k8saudit-rules:latest"]
              follow:
                refs: ["falco-rules:latest", "falco-incubating-rules:latest", "k8saudit-rules:latest"]

        falco:
          json_output: true
          append_output:
            - extra_fields:
                - wazuh_integration: "falco"
          file_output:
            enabled: true
            keep_alive: false
            filename: /var/log/falco/events.json
          rules_files:
            - /etc/falco/falco_rules.yaml
            - /etc/falco/falco-incubating_rules.yaml
            - /etc/falco/k8s_audit_rules.yaml
            - /etc/falco/rules.d
          plugins:
            - name: k8saudit
              library_path: libk8saudit.so
              init_config: ""
              open_params: "http://:9765/k8s-audit"
            - name: json
              library_path: libjson.so
              init_config: ""
          load_plugins: [k8saudit, json]

  destination:
    server: https://kubernetes.default.svc
    namespace: falco

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
