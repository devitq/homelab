apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediamtx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://startechnica.github.io/apps
    chart: mediamtx
    targetRevision: 0.1.1
    helm:
      valuesObject:
        service:
          type: LoadBalancer
        configs:
          existingConfigMapName: mediamtx-custom
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: mediamtx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
