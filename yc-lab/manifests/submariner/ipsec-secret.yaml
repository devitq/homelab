apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: submariner-ipsec-psk
  namespace: submariner-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: submariner-ipsec-psk
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: psk
      remoteRef:
        key: /submariner/SUBMARINER_IPSEC_PSK
