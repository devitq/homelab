apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    grafana_datasource: "1"
  name: victoriametrics-grafana-datasource
  namespace: observability
data:
  victoriametrics.yaml: |-
    apiVersion: 1
    prune: true

    datasources:
      - name: "VictoriaMetrics"
        type: prometheus
        access: proxy
        orgId: 1
        uid: "victoriametrics"
        url: "http://vmsingle-main.observability.svc.cluster.local:8429"
        basicAuth: false
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          queryTimeout: 10s
          timeInterval: "10s"
