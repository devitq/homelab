              "description": "Shows the connectivity status between Cilium nodes. **Reachable** = nodes can communicate with each other, **Unreachable** = network connectivity issues, **Unknown** = status cannot be determined. All nodes should show as 'Reachable' for proper cluster operation. Unreachable nodes may indicate network failures, firewall issues, or node problems. This is critical for cluster-wide network policy enforcement and service mesh functionality.",
