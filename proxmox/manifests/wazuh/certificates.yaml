apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: indexer-certs
  namespace: wazuh
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: indexer-certs
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: admin-key.pem
      remoteRef:
        key: /wazuh/INDEXER_ADMIN_KEY
    - secretKey: admin.pem
      remoteRef:
        key: /wazuh/INDEXER_ADMIN_CERT
    - secretKey: indexer-key.pem
      remoteRef:
        key: /wazuh/INDEXER_KEY
    - secretKey: indexer.pem
      remoteRef:
        key: /wazuh/INDEXER_CERT
    - secretKey: root-ca.pem
      remoteRef:
        key: /wazuh/ROOT_CA_CERT
---
