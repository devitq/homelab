apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falco-agent-manager-ingress
  namespace: wazuh
spec:
  podSelector:
    matchLabels:
      app: wazuh-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wazuh-agent
          podSelector:
            matchLabels:
              app: wazuh-falco-agent
      ports:
        - protocol: TCP
          port: 1517
