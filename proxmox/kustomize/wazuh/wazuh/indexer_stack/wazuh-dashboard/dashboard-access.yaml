apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dashboard-access
  namespace: wazuh
spec:
  endpointSelector:
    matchLabels:
      app: wazuh-dashboard
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
