apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vdeniske-cert
  namespace: vdeniske
spec:
  secretName: vdeniske-tls
  issuerRef:
    name: infisical
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
  duration: 720h
  renewBefore: 240h
  dnsNames:
    - vdeniske.itqdev.xyz
