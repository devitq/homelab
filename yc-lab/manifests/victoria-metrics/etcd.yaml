apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: etcd
  namespace: observability
  labels:
    app.kubernetes.io/instance: victoria-metrics-k8s-stack
spec:
  jobName: kube-etcd
  targetEndpoints:
    - targets:
        - 10.4.0.3:2381
        - 10.4.0.10:2381
        - 10.5.0.24:2381
      labels:
        job: kube-etcd
        component: etcd
      scheme: http
