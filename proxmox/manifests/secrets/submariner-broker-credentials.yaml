apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: submariner-broker-client-token
  namespace: submariner-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: submariner-k8s-broker-remote-client-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        namespace: submariner-operator
        token: "{{ .brokerToken }}"
        ca.crt: "{{ .brokerCaCert }}"
  data:
    - secretKey: brokerToken
      remoteRef:
        key: /submariner/BROKER_CLIENT_TOKEN
    - secretKey: brokerCaCert
      remoteRef:
        key: /submariner/BROKER_CLIENT_CA_CERT
