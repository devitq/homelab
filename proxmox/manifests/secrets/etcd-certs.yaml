apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-certs
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: etcd-certs
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ca.crt
      remoteRef:
        key: /observability/ETCD_CA_CERT
    - secretKey: client.crt
      remoteRef:
        key: /observability/ETCD_CLIENT_CERT
    - secretKey: client.key
      remoteRef:
        key: /observability/ETCD_CLIENT_KEY
