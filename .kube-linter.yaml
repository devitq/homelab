checks:
  # Keep KubeLinter's built-in default checks
  # no-read-only-root-fs, unset-cpu-requirements, unset-memory-requirements, host-network/-pid, latest-tag, privileged-container, privilege-escalation-container, pdb-*, unsafe-sysctls, no-anti-affinity, env-var-secret, dangling-service, ...
  doNotAutoAddDefaults: false

  include:
    - no-liveness-probe
    - no-readiness-probe

    - unset-cpu-requirements
    - unset-memory-requirements

    - run-as-non-root
    - default-service-account
    - deprecated-service-account-field

    - wildcard-in-rules
    - writable-host-mount
    - read-secret-from-env-var
    - privileged-ports

    - no-rolling-update-strategy
    - minimum-three-replicas
    - hpa-minimum-three-replicas

    - dangling-ingress
    - dangling-networkpolicy
    - dangling-horizontalpodautoscaler
    - dangling-servicemonitor

  exclude: []
