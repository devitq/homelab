apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-cert
  namespace: gateway-system
spec:
  secretName: jellyfin-tls
  issuerRef:
    name: infisical
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
  duration: 720h
  renewBefore: 240h
  dnsNames:
    - jellyfin.itqdev.xyz
