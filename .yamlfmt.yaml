include:
  - "**/*.yaml"
  - "**/*.yml"

exclude:
  - "**/vendor/**"
  - "**/node_modules/**"
  - "**/charts/**/templates/**"

line_ending: lf

formatter:
  type: basic
  indent: 2
  include_document_start: false
  retain_line_breaks_single: true
  trim_trailing_whitespace: true
  eof_newline: true
  pad_line_comments: 1
