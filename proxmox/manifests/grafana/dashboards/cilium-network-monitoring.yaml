          "panel-6": {
            "kind": "Panel",
            "spec": {
              "id": 6,
              "title": "BPF Map Operations Rate",
              "description": "Shows the rate of operations (create, update, delete) on BPF maps. High operation rates indicate active network state changes like new connections, policy updates, or endpoint modifications. **Update** operations are most common during normal operation. **Delete** operations may indicate connection cleanup or policy changes. Monitor for unusual spikes that could indicate network issues, policy conflicts, or resource pressure.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
