                          "spec": {
                            "exemplar": false,
                            "expr": "sum(\n  rate(\n    envoy_http2_outbound_flood{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\",\npod=~\"$pod\"\n\n\n    }[$__rate_interval]\n  )\n)\n",
