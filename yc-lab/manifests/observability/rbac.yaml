apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-health
  namespace: observability

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-health
rules:
  - nonResourceURLs:
      - /livez
      - /readyz
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-health
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-health
subjects:
  - kind: ServiceAccount
    name: kube-health
    namespace: observability

---
apiVersion: v1
kind: Secret
metadata:
  name: kube-health-token
  namespace: observability
  annotations:
    kubernetes.io/service-account.name: kube-health
type: kubernetes.io/service-account-token
