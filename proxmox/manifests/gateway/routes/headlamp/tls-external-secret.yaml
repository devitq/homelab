apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-tls
  namespace: gateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: headlamp-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: /gateway/HEADLAMP_TLS_CERT
    - secretKey: tls.key
      remoteRef:
        key: /gateway/HEADLAMP_TLS_KEY
