          "panel-7": {
            "kind": "Panel",
            "spec": {
              "id": 7,
              "title": "Kubernetes Events Received",
              "description": "Tracks the rate of Kubernetes events (create, update, delete) that Cilium agents receive from the Kubernetes API server. These events trigger network policy updates, endpoint state changes, and service discovery updates. **Create** events = new pods/services, **Update** events = configuration changes, **Delete** events = resource cleanup. High event rates may indicate cluster churn, deployments, or configuration changes. Monitor for correlation with network issues.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "victoriametrics"
                          },
                          "spec": {
                            "expr": "cilium_kubernetes_events_received_total{instance=~\".*\"}",
