apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-csi-config
  namespace: proxmox-csi-plugin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: proxmox-csi-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        config.yaml: |
          clusters:
            - url: https://10.13.0.1:8006/api2/json
              insecure: true
              token_id: kubernetes-csi@pve!csi
              token_secret: "{{ .tokenSecret }}"
              region: Region1
  data:
    - secretKey: tokenSecret
      remoteRef:
        key: /proxmox-csi/TOKEN_SECRET
