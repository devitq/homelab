apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-runner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.gitlab.io
    targetRevision: 0.92.1
    chart: gitlab-runner
    helm:
      parameters:
        - name: rbac.create
          value: 'true'
        - name: concurrent
          value: '1'
        - name: securityContext.allowPrivilegeEscalation
          value: 'true'
      values: |-
        gitlabUrl: https://gitlab.itqdev.xyz

        runners:
          secret: gitlab-runner-credentials
          config: |
            [[runners]]
              [runners.kubernetes]
                namespace = "{{.Release.Namespace}}"
                image = "alpine"
                privileged = true

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab-runner

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
