apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: indexer-credentials
  namespace: wazuh
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: indexer-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/component: credentials
  data:
    - secretKey: wazuh-credentials
      remoteRef:
        key: /wazuh/INDEXER_CREDENTIALS
