apiVersion: v1
kind: Pod
metadata:
  name: bpf-debug
  namespace: kube-system
spec:
  hostNetwork: true
  hostPID: true
  restartPolicy: Never
  nodeName: cp-01
  containers:
    - name: debug
      image: nicolaka/netshoot:latest
      command: ["sh", "-c", "sleep infinity"]
      securityContext:
        privileged: true
