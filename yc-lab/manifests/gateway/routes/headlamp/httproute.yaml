apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway-system
      sectionName: headlamp-https

  hostnames:
    - "k8s.yc.infra.itqdev.xyz"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
